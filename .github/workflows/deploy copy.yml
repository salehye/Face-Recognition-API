# ============================================================
# GitHub Actions Workflow - نشر Face Recognition API على VPS
# ============================================================
# المتطلبات (Secrets) التي يجب إضافتها في إعدادات الـ Repository:
#
#   DOCKER_HUB_USERNAME    - اسم المستخدم في Docker Hub
#   DOCKER_HUB_TOKEN       - Token (وليس كلمة السر) من Docker Hub
#   VPS_HOST               - عنوان IP أو Domain الخادم
#   VPS_USER               - اسم مستخدم SSH (مثلاً: root)
#   VPS_SSH_KEY            - المفتاح الخاص SSH (PEM كامل)
#   VPS_PORT               - (اختياري) port الـ SSH، الافتراضي 22
#
# ============================================================

name: Deploy Face Recognition API

on:
  push:
    branches: [main, master]
  workflow_dispatch: # للسماح بالتشغيل اليدوي

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/face-recognition-api
  CONTAINER_NAME: face-recognition-api
  HOST_PORT: 8001
  CONTAINER_PORT: 8001

jobs:
  # ============================================================
  # المرحلة الأولى: بناء الصورة واختبارها
  # ============================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ سحب الكود
        uses: actions/checkout@v4

      - name: 🔧 إعداد Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 تسجيل الدخول إلى Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 🏷️ استخراج الـ tags (git sha + latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 بناء ورفع الصورة (من Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # المرحلة الثانية: النشر على VPS عبر SSH
  # ============================================================
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 النشر على الخادم عبر SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e

            echo "✅ تسجيل الدخول إلى Docker Hub..."
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            echo "🛑 إيقاف الحاوية القديمة..."
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            echo "📦 سحب أحدث صورة..."
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            echo "🧹 تنظيف الصور القديمة..."
            docker image prune -f

            echo "🚀 تشغيل الحاوية الجديدة..."
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              -e PORT=${{ env.CONTAINER_PORT }} \
              -e HOST=0.0.0.0 \
              ${{ env.DOCKER_IMAGE }}:latest

            echo "✅ تم النشر بنجاح!"
            echo "🔍 التأكد من أن الحاوية تعمل..."
            sleep 3
            docker ps --filter name=${{ env.CONTAINER_NAME }} --format "{{.Names}} - {{.Status}}"

            echo "🏥 فحص الـ Health Check..."
            curl -f http://localhost:${{ env.HOST_PORT }}/ || echo "⚠️  تحذير: الـ Health Check لم يستجب بعد (قد يحتاج النموذج وقتاً للتحميل)"
