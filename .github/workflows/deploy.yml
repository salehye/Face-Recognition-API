# ============================================================
# GitHub Actions - نشر FastAPI على VPS
# ============================================================
# الأسرار (Secrets) المطلوبة في إعدادات الـ Repository:
#   VPS_HOST        - عنوان IP الخادم
#   VPS_USER        - اسم مستخدم SSH
#   VPS_SSH_KEY     - المفتاح الخاص SSH (محتوى id_rsa كاملاً)
#   VPS_PORT        - (اختياري) port SSH، الافتراضي 22
# ============================================================

name: Deploy FastAPI to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch: # تتيح لك تشغيل العملية يدوياً من واجهة GitHub

jobs:
  deploy:
    name: 🚀 نشر المشروع على الخادم
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 1. سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: 📂 2. نقل الملفات إلى الخادم باستخدام SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "."
          target: "/home/${{ secrets.VPS_USER }}/fastapi-app"

      - name: 🚀 3. تشغيل أوامر الإعداد على الخادم
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/fastapi-app

            # إنشاء البيئة الافتراضية إذا لم تكن موجودة
            if [ ! -d "venv" ]; then
                python3 -m venv venv
            fi

            # تفعيل البيئة الافتراضية وتثبيت المتطلبات
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # إيقاف الخدمة القديمة (إن وجدت)
            sudo systemctl stop my-fastapi-app || true

            # نسخ ملف إعدادات الخدمة إلى مجلد systemd
            echo "⚙️ 4. إعداد خدمة systemd..."
            sudo cp fastapi-app.service /etc/systemd/system/

            # إعادة تحميل systemd وبدء الخدمة
            sudo systemctl daemon-reload
            sudo systemctl enable my-fastapi-app
            sudo systemctl start my-fastapi-app

            echo "✅ 5. تم النشر بنجاح!"  ممكن كمان ملف اخر لمشروع لارفل 13